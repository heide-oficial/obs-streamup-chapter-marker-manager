# Personal fork workflow, modified 2026-11-19; see FORK.md.
name: Push
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - run: cmake -S tests -B build_tests && cmake --build build_tests && ctest --test-dir build_tests --output-on-failure
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build Windows plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo
      - name: Package Windows plugin
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: RelWithDebInfo
          package: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-marker-manager-windows-x64
          path: release/*.zip
          if-no-files-found: error
