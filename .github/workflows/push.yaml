# Personal fork workflow, modified 2026-11-19; see FORK.md.
name: Push
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build Windows plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo
      - name: Test counters, export paths and keyboard picker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = (Get-ChildItem .deps -Directory -Filter 'obs-deps-qt6-*' | Select-Object -First 1).FullName
          if (-not $qtRoot) { throw 'The Qt SDK prepared by the plugin build is missing.' }
          cmake -S tests -B build_tests -A x64 "-DCMAKE_PREFIX_PATH=$qtRoot"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build_tests --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$qtRoot/bin;$env:PATH"
          ctest --test-dir build_tests -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package Windows plugin
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: RelWithDebInfo
          package: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-marker-manager-windows-x64
          path: release/*.zip
          if-no-files-found: error
